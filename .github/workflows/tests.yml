name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.9
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
